services:
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fixpoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d fixpoint']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./FixPoint.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Database=fixpoint;Username=postgres;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: FixPoint
      Jwt__Audience: FixPointClient
    ports: ['5080:8080']
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['5173:80']
    depends_on: [api]
volumes:
  pgdata:
